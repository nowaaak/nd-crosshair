name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $version = '0.0.0-dev.' + $env:GITHUB_RUN_NUMBER
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish portable build
        run: >
          dotnet publish src/NdCrosshair.App -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:Version=${{ steps.version.outputs.value }}
          -o artifacts/portable

      - name: Publish framework-dependent build
        run: >
          dotnet publish src/NdCrosshair.App -c Release -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:DebugType=none
          -p:Version=${{ steps.version.outputs.value }}
          -o artifacts/framework-dependent

      - name: Publish installer build
        run: >
          dotnet publish src/NdCrosshair.App -c Release -r win-x64
          --self-contained true
          -p:DebugType=none
          -p:Version=${{ steps.version.outputs.value }}
          -o artifacts/installer

      - name: Restore tools
        run: dotnet tool restore

      - name: Download previous installer release for delta updates
        if: github.ref_type == 'tag'
        run: >
          dotnet vpk download github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ github.token }}
          --outputDir velopack

      - name: Build installer and update packages
        run: >
          dotnet vpk pack
          --packId NdCrosshair
          --packVersion ${{ steps.version.outputs.value }}
          --packDir artifacts/installer
          --mainExe NdCrosshair.exe
          --packTitle "ND Crosshair"
          --packAuthors nowaaak
          --icon src/NdCrosshair.App/Assets/app.ico
          --outputDir velopack

      - name: Package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.value }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path artifacts/portable/NdCrosshair.exe, LICENSE -DestinationPath "dist/NdCrosshair-$version-win-x64-portable.zip"
          Compress-Archive -Path artifacts/framework-dependent/NdCrosshair.exe, LICENSE -DestinationPath "dist/NdCrosshair-$version-win-x64-requires-dotnet10.zip"
          Get-FileHash dist/*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NdCrosshair-${{ steps.version.outputs.value }}
          path: |
            dist/*
            velopack/*

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME dist/* --title "ND Crosshair $env:GITHUB_REF_NAME" --generate-notes

      - name: Upload installer and update packages
        if: github.ref_type == 'tag'
        run: >
          dotnet vpk upload github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ github.token }}
          --outputDir velopack
          --tag ${{ github.ref_name }}
          --merge
          --publish
