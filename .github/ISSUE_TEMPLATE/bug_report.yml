name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. English or German are both fine.
        Danke für die Meldung. Deutsch oder Englisch sind beide in Ordnung.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ND Crosshair version
      description: Shown on the About page.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Build
      options:
        - Portable (includes .NET)
        - Requires .NET 8
        - Built from source
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game and display mode
      description: Only if the problem happens in a game.
      placeholder: "Fortnite, windowed fullscreen"
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Drag and drop images here.
